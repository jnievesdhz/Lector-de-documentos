name: Evaluar docx-preview

on:
  push:
    branches: [ evaluacion-docx-preview ]

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar docx-preview y Chromium
        working-directory: eval
        run: |
          npm init -y > /dev/null
          npm i docx-preview jszip playwright
          npx playwright install --with-deps chromium

      - name: Renderizar documentos
        working-directory: eval
        run: node render.js

      - name: Guardar resultados en la rama
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add eval/resultados
          git commit -m "Resultados de la evaluación de docx-preview [skip ci]" || true
          git push
