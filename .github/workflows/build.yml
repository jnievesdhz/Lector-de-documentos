name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar la app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/release/app-release.apk "Lector-v0.1.${{ github.run_number }}.apk"

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Lector-v0.1.${{ github.run_number }}
          path: Lector-v0.1.${{ github.run_number }}.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Lector v0.1.${{ github.run_number }}
          body: APK generado automáticamente. Descárgalo en el celular e instálalo.
          files: Lector-v0.1.${{ github.run_number }}.apk
