name: Bajar fuentes externas

# Se corre a mano. Baja Selawik (gemela libre de Segoe UI, no está en Google Fonts)
# y la guarda en fuentes-externas/ para armar el paquete de fuentes.
# Akasia (gemela libre de Aptos) estaba en codeberg.org/bloudraad/akasia, pero en
# noviembre de 2026 ese repositorio ya no existía. Aptos usa Source Sans 3 ajustada.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fuentes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bajar Selawik (GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          rm -rf fuentes-externas && mkdir -p fuentes-externas/selawik /tmp/fx/s
          cd /tmp/fx/s
          gh release download -R microsoft/Selawik --pattern '*' || true
          ls -la
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d unz; done
          find . -type f \( -iname '*.ttf' -o -iname '*.otf' \) -exec cp {} "$GITHUB_WORKSPACE/fuentes-externas/selawik/" \;
          gh api repos/microsoft/Selawik/contents/LICENSE.txt --jq .content | base64 -d > "$GITHUB_WORKSPACE/fuentes-externas/selawik/LICENSE.txt"
          cd "$GITHUB_WORKSPACE"
          ls -laR fuentes-externas

      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add fuentes-externas
          git commit -m "Fuentes externas (Selawik) [skip ci]" || echo "sin cambios"
          git push
